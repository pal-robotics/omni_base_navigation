nodes: 
  roof_rgbd_camera:
    app: realsense
    params: [default_435_roof]
    namespace: "/roof_rgbd_camera"
  base_rgbd_camera:
    app: realsense
    params: [default_435_base]
    namespace: "/base_rgbd_camera"